  /communication:
    get:
      summary: Consultar comunicação
      description: Retorna as notas e mensagens disponíveis para o usuário.
      security:
        - cookieSession: []
      responses:
        '200':
          description: Itens de comunicação.
          content:
            application/json:
              schema:
                type: array
                items:
