  /physical-materials:
    get:
      summary: Listar materiais físicos enviados
      security:
        - cookieSession: []
      responses:
        '200':
          description: Materiais físicos associados aos trabalhos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PhysicalMaterial'
    post:
      summary: Registrar envio de material físico
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhysicalMaterialInput'
      responses:
        '201':
          description: Envio registrado.

  /work-types/{workTypeId}/stages:
    get:
      summary: Listar etapas de um tipo de trabalho
      security:
        - cookieSession: []
      parameters:
        - name: workTypeId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Etapas ordenadas do tipo de trabalho.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StageIndex'

components:
  parameters:
    clientId:
      name: clientId
      in: path
      required: true
      schema:
        type: integer
    workOrderId:
      name: workOrderId
      in: path
      required: true
      schema:
        type: integer
    workId:
      name: workId
      in: path
      required: true
      schema:
        type: integer
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: token
      description: Authentication session cookie
  schemas:
    AuthRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password

    User:
      type: object
      properties:
        userId:
          type: integer
        roleId:
          type: integer
        name:
          type: string
        email:
          type: string
        accountStatus:
          type: string
          enum: [active, inactive, verification]
        accountType:
          type: string
          enum: [client, worker, admin]
        contactInfo:
          type: string
    
    CreateUser:
      type: object
      properties:
        name:
          type: string
        password:
          type: string
        email:
          type: string
        accountStatus:
          type: string
          enum: [active, inactive, verification]
        accountType:
          type: string
          enum: [client, worker, admin]
        contactInfo:
          type: string
      required:
        - name
        - password
        - email
        - accountStatus
        - accountType


    Role:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
    
    Permission:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string

    RolePermissions:
      type: object
      properties:
        roleId:
          type: string
        permissionId:
          type: string
        canRead:
          type: boolean
        canEdit:
          type: boolean
        canCreate:
          type: boolean

    Client:
      type: object
      properties:
        clientId:
          type: integer
        userId:
          type: integer
        nif:
          type: string
          maxLength: 30
        address:
          type: string
          maxLength: 250
      required: [clientId, userId, nif]
    ClientInput:
      type: object
      properties:
        userId:
          type: integer
        nif:
          type: string
          maxLength: 30
        address:
          type: string
          maxLength: 250
      required: [userId, nif]
    Patient:
      type: object
      description: A entidade Patient é referenciada pelo modelo de dados, mas seus campos não foram especificados.
      properties:
        patientId:
          type: integer
    WorkOrder:
      type: object
      properties:
        workOrderId:
          type: integer
        clientId:
          type: integer
        patientId:
          type: integer
        nextAppointmentDate:
          type: string
          format: date
        patientExternalId:
          type: string
          maxLength: 150
        sex:
          type: string
          maxLength: 20
        age:
          type: integer
        creationDateTime:
          type: string
          format: date-time
      required: [workOrderId, clientId, patientId, nextAppointmentDate, patientExternalId, creationDateTime]
    WorkOrderInput:
      allOf:
        - $ref: '#/components/schemas/WorkOrder'
      description: Dados para criar ou atualizar uma ordem de serviço; workOrderId é gerado pelo servidor.
    Work:
      type: object
