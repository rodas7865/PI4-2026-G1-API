  /catalogs:
    get:
      summary: Consultar catálogos
      description: Retorna os tipos de trabalho, materiais, dentes e cores cadastrados.
      security:
        - cookieSession: []
      responses:
        '200':
          description: Catálogos disponíveis.
          content:
            application/json:
              schema:
                type: object
                properties:
                  workTypes:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkType'
                  materials:
                    type: array
                    items:
                      $ref: '#/components/schemas/Material'
                  teeth:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tooth'
                  colors:
                    type: array
                    items:
                      $ref: '#/components/schemas/Color'
  /work-types:
    get:
      summary: Listar tipos de trabalho
      security:
        - cookieSession: []
      responses:
        '200':
          description: Lista de tipos de trabalho.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WorkType'
    post:
      summary: Criar tipo de trabalho
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkType'
      responses:
        '201':
          description: Tipo de trabalho criado.
  /materials:
    get:
      summary: Listar materiais
      security:
        - cookieSession: []
      responses:
        '200':
          description: Lista de materiais.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Material'
    post:
      summary: Criar material
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Material'
