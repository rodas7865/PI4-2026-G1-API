  /clients/{clientId}:
    get:
      summary: Obter cliente
      security:
        - cookieSession: []
      parameters:
        - $ref: '#/components/parameters/clientId'
      responses:
        '200':
          description: Cliente encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '404':
          description: Cliente não encontrado.
    patch:
      summary: Atualizar cliente
      security:
        - cookieSession: []
      parameters:
        - $ref: '#/components/parameters/clientId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientInput'
      responses:
        '200':
          description: Cliente atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '404':
          description: Cliente não encontrado.
    delete:
      summary: Excluir cliente
      security:
        - cookieSession: []
      parameters:
        - $ref: '#/components/parameters/clientId'
      responses:
        '204':
          description: Cliente excluído.
        '404':
          description: Cliente não encontrado.

  /work-orders:
