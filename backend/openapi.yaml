      security:
        - cookieSession: []
      parameters:
        - $ref: '#/components/parameters/workId'
      responses:
        '204':
          description: Trabalho excluído.
        '404':
          description: Trabalho não encontrado.

  /production:
    get:
      summary: Consultar produção
      description: Retorna os registros de etapas de produção.
      security:
        - cookieSession: []
      responses:
        '200':
          description: Registros de produção.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StageRecord'
  /stages:
    get:
      summary: Listar etapas
      security:
        - cookieSession: []
      responses:
        '200':
          description: Lista de etapas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Stage'
    post:
      summary: Criar etapa
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Stage'
      responses:
        '201':
          description: Etapa criada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stage'
  /stage-records:
