          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrder'
        '400':
          description: Requisição inválida.
  /work-orders/{workOrderId}:
    get:
      summary: Obter ordem de serviço
      security:
        - cookieSession: []
      parameters:
        - $ref: '#/components/parameters/workOrderId'
      responses:
        '200':
          description: Ordem de serviço encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrder'
        '404':
          description: Ordem de serviço não encontrada.
    patch:
      summary: Atualizar ordem de serviço
      security:
        - cookieSession: []
      parameters:
        - $ref: '#/components/parameters/workOrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkOrderInput'
      responses:
        '200':
          description: Ordem de serviço atualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrder'
        '404':
          description: Ordem de serviço não encontrada.
    delete:
      summary: Excluir ordem de serviço
      security:
        - cookieSession: []
      parameters:
        - $ref: '#/components/parameters/workOrderId'
      responses:
        '204':
          description: Ordem de serviço excluída.
        '404':
          description: Ordem de serviço não encontrada.

  /works:
    get:
      summary: Listar trabalhos
      security:
        - cookieSession: []
      responses:
        '200':
          description: Lista de trabalhos.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Work'
    post:
      summary: Criar trabalho
      security:
        - cookieSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkInput'
      responses:
        '201':
          description: Trabalho criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Work'
        '400':
          description: Requisição inválida.
  /works/{workId}:
    get:
      summary: Obter trabalho
      security:
        - cookieSession: []
      parameters:
        - $ref: '#/components/parameters/workId'
      responses:
        '200':
          description: Trabalho encontrado.
          content:
