components:
  parameters:
    noteId:
        name: noteId
        in: path
        required: true
        schema:
          type: integer
    workerId:
        name: workerId
        in: path
        required: true
        schema:
          type: integer
    fileId:
        name: fileId
        in: path
        required: true
        schema:
          type: integer
    workTypeId:
        name: workTypeId
        in: path
        required: true
        schema:
          type: integer
    materialId:
        name: materialId
        in: path
        required: true
        schema:
          type: integer
    stageIndexId:
        name: stageIndexId
        in: path
        required: true
        schema:
          type: integer
    colorId:
        name: colorId
        in: path
        required: true
        schema:
          type: integer
    stageId:
        name: stageId
        in: path
        required: true
        schema:
          type: integer
    worderId:
        name: workerId
        in: path
        required: true
        schema:
          type: integer
    clientId:
      name: clientId
      in: path
      required: true
      schema:
        type: integer
    workOrderId:
      name: workOrderId
      in: path
      required: true
      schema:
        type: integer
    workId:
      name: workId
      in: path
      required: true
      schema:
        type: integer
    patientId:
      name: patientId
      in: path
      required: true
      schema:
        type: string
    toothId:
      name: toothId
      in: path
      required: true
      schema:
        type: integer
    roleId:
      name: roleId
      in: path
      required: true
      schema:
        type: integer
    permissionId:
      name: permissionId
      in: path
      required: true
      schema:
        type: integer
    logId:
      name: logId
      in: path
      required: true
      schema:
        type: integer
    physicalMaterialId:
      name: physicalMaterialId
      in: path
      required: true
      schema:
        type: integer
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: token
      description: Authentication session cookie
  schemas:
    AuthRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password

    User:
      type: object
      properties:
        userId:
          type: integer
        name:
          type: string
        email:
          type: string
        accountStatus:
          type: string
          enum: [active, inactive, verification]
        accountType:
          type: string
          enum: [client, worker, admin]
        contactInfo:
          type: string
    
    CreateUser:
      type: object
      properties:
        name:
          type: string
        password:
          type: string
        email:
          type: string
        accountStatus:
          type: string
          enum: [active, inactive, verification]
        accountType:
          type: string
          enum: [client, worker, admin]
        contactInfo:
          type: string
      required:
        - name
        - password
        - email
        - accountStatus
        - accountType

    UserUpdate:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          minProperties: 1

    Role:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
    
    Permission:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string

    RolePermissions:
      type: object
      properties:
        roleId:
          type: integer
        permissionId:
          type: integer
        canRead:
          type: boolean
        canWrite:
          type: boolean

    Client:
      type: object
      properties:
        clientId:
          type: integer
        userId:
          type: integer
        nif:
          type: string
          maxLength: 30
        address:
          type: string
          maxLength: 250
      required: [clientId, userId, nif]
    ClientInput:
      type: object
      properties:
        userId:
          type: integer
        nif:
          type: string
          maxLength: 30
        address:
          type: string
          maxLength: 250
      required: [userId, nif]
    Patient:
      type: object
      properties:
        patientId:
          type: string
          maxLength: 50
      required: [patientId]
    PatientInput:
      type: object
      properties:
        patientId:
          type: string
          maxLength: 50
      required: [patientId]
    WorkOrder:
      type: object
      properties:
        workOrderId:
          type: integer
        clientId:
          type: integer
        patientId:
          type: string
        nextAppointmentDate:
          type: string
          format: date
        patientExternalId:
          type: string
          maxLength: 150
        sex:
          type: string
          maxLength: 20
        age:
          type: integer
        creationDateTime:
          type: string
          format: date-time
      required: [workOrderId, clientId, patientId, nextAppointmentDate, patientExternalId, creationDateTime]
    WorkOrderInput:
      allOf:
        - $ref: '#/components/schemas/WorkOrder'
      description: Dados para criar ou atualizar uma ordem de serviço; workOrderId é gerado pelo servidor.
    Work:
      type: object
      properties:
        workId:
          type: integer
        workOrderId:
          type: integer
        workTypeId:
          type: integer
        materialId:
          type: integer
        status:
          type: string
        colorId:
          type: integer
          nullable: true
        additionalInformation:
          type: string
          maxLength: 200
        nature:
          type: string
          maxLength: 20
        toothIds:
          type: array
          items:
            type: integer
      required: [workId, workOrderId, workTypeId, materialId, status]
    WorkInput:
      allOf:
        - $ref: '#/components/schemas/Work'
      description: Dados para criar ou atualizar um trabalho; workId é gerado pelo servidor.
    WorkType:
      type: object
      properties:
        workTypeId:
          type: integer
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 256
      required: [workTypeId, name]
    Material:
      type: object
      properties:
        materialId:
          type: integer
        name:
          type: string
          maxLength: 100
      required: [materialId, name]
    Tooth:
      type: object
      properties:
        toothId:
          type: integer
        name:
          type: string
          maxLength: 20
    WorkTooth:
      type: object
      properties:
        workId:
          type: integer
        toothId:
          type: integer
      required: [workId, toothId]
    Stage:
      type: object
      properties:
        stageId:
          type: integer
        name:
          type: string
          maxLength: 100
        description:
          type: string
          maxLength: 256
      required: [stageId, name]
    StageIndex:
      type: object
      properties:
        stageIndexId:
          type: integer
        workTypeId:
          type: integer
        stageId:
          type: integer
      required: [stageIndexId, workTypeId, stageId]
    Color:
      type: object
      properties:
        colorId:
          type: integer
        name:
          type: string
          maxLength: 100
      required: [colorId, name]
    StageRecord:
      type: object
      properties:
        stageRecordId:
          type: integer
        workId:
          type: integer
        stageId:
          type: integer
        workerId:
          type: integer
          nullable: true
        startDateTime:
          type: string
          format: date-time
        endDateTime:
          type: string
          format: date-time
        note:
          type: string
          maxLength: 200
      required: [stageRecordId, workId, stageId]
    StageRecordInput:
      type: object
      properties:
        workId:
          type: integer
        stageId:
          type: integer
        workerId:
          type: integer
          nullable: true
        startDateTime:
          type: string
          format: date-time
        endDateTime:
          type: string
          format: date-time
        note:
          type: string
          maxLength: 200
      required: [workId, stageId]
    Worker:
      type: object
      properties:
        workerId:
          type: integer
        userId:
          type: integer
        roleId:
          type: integer
      required: [workerId, userId, roleId]
    Note:
      type: object
      properties:
        noteId:
          type: integer
        workId:
          type: integer
        userId:
          type: integer
        content:
          type: string
          maxLength: 256
        creationDateTime:
          type: string
          format: date-time
        isPublic:
          type: boolean
      required: [noteId, workId, userId]
    NoteInput:
      type: object
      properties:
        workId:
          type: integer
        content:
          type: string
          maxLength: 256
        isPublic:
          type: boolean
      required: [workId, content]
    File:
      type: object
      properties:
        fileId:
          type: integer
        workId:
          type: integer
          nullable: true
        userId:
          type: integer
