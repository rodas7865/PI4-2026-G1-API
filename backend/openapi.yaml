          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          description: Requisição inválida.
        '404':
          description: Papel não encontrado.
        '500':
          description: Erro interno do servidor.
    delete:
        summary: Excluir um papel específico
        description: Exclui um papel específico com base no ID fornecido.
        parameters:
          - name: roleId
            in: path
            required: true
            description: ID do papel a ser excluído.
            schema:
              type: string
        responses:
          '204':
            description: Papel excluído com sucesso.
          '404':
            description: Papel não encontrado.
          '500':
            description: Erro interno do servidor.
