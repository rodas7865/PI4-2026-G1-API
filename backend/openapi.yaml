openapi: 3.0.3

info:
  title: API Dental Lab
  version: 2.1.0
  description: API para integração com o sistema de gestão do laboratório odontológico.

security:
  - cookieSession: []

paths:
  /tokens:
    post:
      security: []
      summary: Gerar token de autenticação
      description: Gera um token de autenticação para o usuário com base nas credenciais fornecidas.
      requestBody:
        description: Credenciais do usuário para autenticação.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: Token gerado com sucesso.
        '401':
          description: Credenciais inválidas.
        '500':
          description: Erro interno do servidor.
  /users:
    get:
      summary: Listar todos os usuários
      description: Retorna uma lista de todos os usuários cadastrados no sistema.
      responses:
        '200':
          description: Lista de usuários retornada com sucesso.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '500':
          description: Erro interno do servidor.
    post:
      summary: Criar um novo usuário
      description: Cria um novo usuário no sistema com base nos dados fornecidos.
      requestBody:
        description: Dados do usuário a ser criado.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUser'
      responses:
        '201':
          description: Usuário criado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Requisição inválida.
        '500':
          description: Erro interno do servidor.
  /users/{userId}:
    get:
      summary: Obter detalhes de um usuário específico
      description: Retorna os detalhes de um usuário específico com base no ID fornecido.
      parameters:
        - name: userId
          in: path
          required: true
          description: ID do usuário a ser obtido.
          schema:
            type: string
      responses:
        '200':
          description: Detalhes do usuário retornados com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          description: Usuário não encontrado.
        '500':
          description: Erro interno do servidor.
    patch:
      summary: Atualizar um usuário específico
      description: Atualiza os detalhes de um usuário específico com base no ID fornecido.
      parameters:
        - name: userId
          in: path
          required: true
          description: ID do usuário a ser atualizado.
          schema:
            type: string
      requestBody:
        description: Dados do usuário a serem atualizados.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: Usuário atualizado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Requisição inválida.
        '404':
          description: Usuário não encontrado.
        '500':
          description: Erro interno do servidor.
    delete:
        summary: Excluir um usuário específico
        description: Exclui um usuário específico com base no ID fornecido.
        parameters:
          - name: userId
            in: path
            required: true
            description: ID do usuário a ser excluído.
            schema:
              type: string
        responses:
          '204':
            description: Usuário excluído com sucesso.
          '404':
            description: Usuário não encontrado.
          '500':
            description: Erro interno do servidor.
  /roles:
    get:
      summary: Listar todos os papéis
      description: Retorna uma lista de todos os papéis disponíveis no sistema.
      responses:
        '200':
          description: Lista de papéis retornada com sucesso.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
        '500':
          description: Erro interno do servidor.
    post:
      summary: Criar um novo papel
      description: Cria um novo papel no sistema com base nos dados fornecidos.
      requestBody:
        description: Dados do papel a ser criado.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Role'
      responses:
        '201':
          description: Papel criado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          description: Requisição inválida.
        '500':
          description: Erro interno do servidor.
  /users/{userId}/permissions:
    get:
      summary: Listar papéis de um usuário específico e o seu papel
      description: Retorna uma lista de papéis associados a um usuário específico com base no ID fornecido.
      parameters:
        - name: userId
          in: path
          required: true
          description: ID do usuário cujos papéis serão listados.
          schema:
            type: string
      responses:
        '200':
          description: Lista de papéis retornada com sucesso.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
        '404':
          description: Usuário não encontrado.
        '500':
          description: Erro interno do servidor.
  /roles/{roleId}:
    get:
      summary: Obter detalhes de um papel específico
      description: Retorna os detalhes de um papel específico com base no ID fornecido.
      parameters:
        - name: roleId
          in: path
          required: true
          description: ID do papel a ser obtido.
          schema:
            type: string
      responses:
        '200':
          description: Detalhes do papel retornados com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '404':
          description: Papel não encontrado.
        '500':
          description: Erro interno do servidor.
    patch:
      summary: Atualizar um papel específico
      description: Atualiza os detalhes de um papel específico com base no ID fornecido.
      parameters:
        - name: roleId
          in: path
          required: true
          description: ID do papel a ser atualizado.
          schema:
            type: string
      requestBody:
        description: Dados do papel a serem atualizados.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Role'
      responses:
        '200':
          description: Papel atualizado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '400':
          description: Requisição inválida.
        '404':
          description: Papel não encontrado.
        '500':
          description: Erro interno do servidor.
    delete:
        summary: Excluir um papel específico
        description: Exclui um papel específico com base no ID fornecido.
        parameters:
          - name: roleId
            in: path
            required: true
            description: ID do papel a ser excluído.
            schema:
              type: string
        responses:
          '204':
            description: Papel excluído com sucesso.
          '404':
            description: Papel não encontrado.
          '500':
            description: Erro interno do servidor.
  /roles/{roleId}/permissions:
    get:
      summary: Listar permissões de um papel específico
      description: Retorna uma lista de permissões associadas a um papel específico com base no ID fornecido.
      parameters:
        - name: roleId
          in: path
          required: true
          description: ID do papel cujas permissões serão listadas.
          schema:
            type: string
      responses:
        '200':
          description: Lista de permissões retornada com sucesso.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Permission'
        '404':
          description: Papel não encontrado.
        '500':
          description: Erro interno do servidor.
    patch:
      summary: Atualizar permissões de um papel específico
      description: Atualiza as permissões associadas a um papel específico com base no ID fornecido.
      parameters:
        - name: roleId
          in: path
          required: true
          description: ID do papel cujas permissões serão atualizadas.
          schema:
            type: string
      requestBody:
        description: Lista de permissões a serem associadas ao papel.
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Permission'
      responses:
        '200':
          description: Permissões atualizadas com sucesso.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Permission'
        '400':
          description: Requisição inválida.
        '404':
          description: Papel não encontrado.
        '500':
          description: Erro interno do servidor.
    post:
      summary: Adicionar permissões a um papel específico
      description: Adiciona novas permissões a um papel específico com base no ID fornecido.
      parameters:
        - name: roleId
          in: path
          required: true
          description: ID do papel ao qual as permissões serão adicionadas.
          schema:
            type: string
      requestBody:
        description: Lista de permissões a serem adicionadas ao papel.
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Permission'
      responses:
        '200':
          description: Permissões adicionadas com sucesso.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Permission'
        '400':
          description: Requisição inválida.
        '404':
          description: Papel não encontrado.
        '500':
          description: Erro interno do servidor.

  /clients:
    get:
      summary: Listar clientes
      security:
